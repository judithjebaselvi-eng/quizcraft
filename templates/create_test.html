<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test - QuizCraft</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exam.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-page">
    {% include 'navbar.html' %}
    
    <div class="dashboard-container">
        {% include 'teacher_sidebar.html' %}
        
        <main class="main-content">
            <div class="page-header">
                <h1>Create New Test</h1>
            </div>
            
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" onclick="switchTab('ai-mode')">
                        <i class="fas fa-brain"></i> QuizCraft AI
                    </button>
                    <button class="tab-btn" onclick="switchTab('manual-mode')">
                        <i class="fas fa-pencil-alt"></i> Manual Creation
                    </button>
                </div>
                
                <!-- AI Mode Tab -->
                <div id="ai-mode" class="tab-content active">
                    <div class="ai-container">
                        <div class="ai-header">
                            <h2>QuizCraft AI - Generate Questions</h2>
                            <p>Describe the test you want to create, and AI will generate questions instantly</p>
                        </div>
                        
                        <div class="ai-input-section">
                            <div class="input-wrapper">
                                <textarea 
                                    id="ai-prompt" 
                                    class="ai-prompt-box" 
                                    placeholder="Example: Create 10 medium-level Chemistry questions about Atomic Structure for B.Tech 3rd year students..."
                                    rows="4"
                                ></textarea>
                                <div class="input-actions">
                                    <button type="button" class="btn btn-icon" id="microphone-btn" onclick="startVoiceInput()" title="Voice Input">
                                        <i class="fas fa-microphone"></i>
                                    </button>
                                    <button type="button" class="btn btn-primary" id="generate-btn" onclick="generateQuestions()">
                                        <i class="fas fa-spark"></i> GENERATE
                                    </button>
                                </div>
                            </div>
                            <div id="voice-status" class="voice-status" style="display:none;">
                                <i class="fas fa-circle"></i> <span id="voice-text">Listening...</span>
                            </div>
                        </div>
                        
                        <div id="generated-questions" class="generated-questions" style="display:none;">
                            <div class="section-header">
                                <h3>Generated Questions</h3>
                                <span class="question-count"><span id="question-count-display">0</span> questions</span>
                            </div>
                            <div id="questions-list" class="questions-list"></div>
                            <div class="action-buttons">
                                <button type="button" class="btn btn-outline" onclick="resetGeneration()">
                                    <i class="fas fa-redo"></i> Generate Again
                                </button>
                                <button type="button" class="btn btn-primary" onclick="proceedToCreateTest()">
                                    <i class="fas fa-check"></i> CREATE TEST
                                </button>
                            </div>
                        </div>
                        
                        <div id="loading-spinner" class="loading-spinner" style="display:none;">
                            <div class="spinner"></div>
                            <p>Generating Questions...</p>
                        </div>
                    </div>
                </div>
                
                <!-- Manual Mode Tab -->
                <div id="manual-mode" class="tab-content">
                    <form method="POST" class="manual-form">
                        <div class="form-group">
                            <label for="test-name">Test Name *</label>
                            <input type="text" id="test-name" name="name" placeholder="E.g., Chemistry Midterm Exam" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="subject">Subject *</label>
                            <input type="text" id="subject" name="subject" placeholder="E.g., Chemistry, DBMS, Python" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="topic">Topic</label>
                            <input type="text" id="topic" name="topic" placeholder="E.g., Atomic Structure">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-arrow-right"></i> NEXT: ADD QUESTIONS
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/ai.js') }}"></script>
    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
