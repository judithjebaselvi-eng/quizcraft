<!-- Navbar -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-brand">
            <a href="/" class="logo">
                <i class="fas fa-graduation-cap"></i>
                <i class="fas fa-check-circle"></i>
                <span>QuizCraft</span>
            </a>
        </div>
        
        <div class="navbar-menu" id="navbarMenu">
            <ul class="navbar-items">
                {% if session.role == 'teacher' %}
                <li><a href="{{ url_for('teacher.dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('teacher.my_tests') }}">My Tests</a></li>
                {% else %}
                <li><a href="{{ url_for('student.dashboard') }}">My Tests</a></li>
                {% endif %}
            </ul>
        </div>
        
        <div class="navbar-actions">
            <div class="user-profile">
                <div class="avatar">
                    {{ session.full_name[0] | upper }}
                </div>
                <div class="user-menu-trigger">
                    <span class="user-name">{{ session.full_name }}</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="user-dropdown-menu">
                    <a href="#profile" class="dropdown-item">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a href="#settings" class="dropdown-item">
                        <i class="fas fa-cog"></i> Settings
                    </a>
                    <hr class="dropdown-divider">
                    <a href="{{ url_for('auth.logout') }}" class="dropdown-item logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
        
        <button class="navbar-toggle" id="navbarToggle">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>
